[project]
name = "lngchain-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "UndefinedBehaviour12", email = "nandakishore7768@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lngchain-tutorial = "lngchain_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
